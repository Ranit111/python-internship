[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devdiag"
version = "1.0.0"
description = "Deterministic Developer Environment & Machine Diagnostics CLI Tool"
readme = "README.md"
authors = [
    { name = "RabTech Intern", email = "intern@example.com" }
]
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
devdiag = "devdiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
